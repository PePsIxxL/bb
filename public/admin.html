<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель редагування — Мій професійний вебпростір</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="login-view" class="admin-login">
    <form class="login-card" id="login-form">
      <h1>Вхід для власника сайту</h1>
      <p style="color:#64748b;font-size:0.95rem;">Змініть пароль за замовчуванням після першого входу (див. README).</p>
      <div class="field">
        <label for="login-user">Логін</label>
        <input type="text" id="login-user" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pass">Пароль</label>
        <input type="password" id="login-pass" name="password" required autocomplete="current-password">
      </div>
      <p id="login-error" class="hidden" style="color:#991b1b;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Увійти</button>
      <p style="margin-top:1rem;text-align:center;"><a href="/">← На сайт</a></p>
    </form>
  </div>

  <div id="admin-view" class="admin-shell hidden">
    <aside class="admin-sidebar">
      <h2>Редагування контенту</h2>
      <nav class="admin-nav" id="admin-nav">
        <button type="button" data-panel="panel-site" class="active">Головна</button>
        <button type="button" data-panel="panel-about">Про мене</button>
        <button type="button" data-panel="panel-skills">Навички</button>
        <button type="button" data-panel="panel-portfolio">Портфоліо</button>
        <button type="button" data-panel="panel-future">Цілі</button>
        <button type="button" data-panel="panel-media">Відео</button>
        <button type="button" data-panel="panel-contacts">Контакти</button>
        <button type="button" data-panel="panel-messages">Повідомлення</button>
      </nav>
      <footer>
        <button type="button" class="btn btn-secondary" id="btn-logout" style="width:100%;margin-bottom:0.5rem;">Вийти</button>
        <a href="/" target="_blank">Переглянути сайт</a>
      </footer>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <h1 style="margin:0;font-size:1.35rem;">Панель адміністратора</h1>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" id="btn-reload">Скасувати зміни</button>
          <button type="button" class="btn btn-primary" id="btn-save">Зберегти все</button>
        </div>
      </div>

      <div id="panel-site" class="panel active"></div>
      <div id="panel-about" class="panel"></div>
      <div id="panel-skills" class="panel"></div>
      <div id="panel-portfolio" class="panel"></div>
      <div id="panel-future" class="panel"></div>
      <div id="panel-media" class="panel"></div>
      <div id="panel-contacts" class="panel"></div>
      <div id="panel-messages" class="panel"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
